<!DOCTYPE html>
<html lang="ko">
<head>
  <script src="/Premium/gate.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>일봉 RSI MACD</title>
  <style>
    body { background: #111; color: #fff; font-family: "Malgun Gothic", "Apple SD Gothic Neo", Arial, sans-serif; margin: 0; padding: 16px; }
    a { color: #D8C0FF; font-size: 22px; text-decoration: none; }
    h1 { text-align: center; color: #FFFFE0; font-size: 28px; line-height: 1.35; margin: 12px 0; }
    p { max-width: 1100px; margin: 0 auto 10px; color: #ccc; font-size: 16px; line-height: 1.5; }
    iframe { display: block; width: min(1100px, 100%); height: 78vh; min-height: 520px; margin: 0 auto; border: 0; background: #000; }
  </style>
</head>
<body>
  <p><a href="index.html">← AI 혁신주 타점</a></p>
  <h1 id="title">일봉</h1>
  <p>일봉입니다. 아래 차트에 MACD와 RSI가 있습니다. 가격 저점 두 곳이 비슷하거나 더 낮은데 MACD와 RSI 저점은 더 높으면 상승 다이버전스입니다.</p>
  <iframe id="chart" title="일봉 MACD RSI"></iframe>
  <script>
    var params = new URLSearchParams(location.search);
    var code = params.get("symbol") || "";
    var name = params.get("name") || code;
    var tv = /^\d{6}$/.test(code) ? "KRX:" + code : code;
    document.title = name + " 일봉";
    document.getElementById("title").textContent = name + " (" + code + ") 일봉";
    var studies = encodeURIComponent(JSON.stringify([
      { id: "MACD@tv-basicstudies" },
      { id: "RSI@tv-basicstudies", inputs: { length: 14 } }
    ]));
    document.getElementById("chart").src =
      "https://www.tradingview.com/widgetembed/?symbol=" + encodeURIComponent(tv) +
      "&interval=D&style=1&theme=dark&hideideas=1&studies=" + studies;
  </script>
</body>
</html>
