        note.className = "clock-note";
        note.id = "note-area-" + index;
        section.appendChild(top);
        section.appendChild(scroll);
        section.appendChild(note);
        host.appendChild(section);
      });
    }
    function areaPoints(rows, area) {
      var points = recentPoints(pointsFromRows(rows, area));
      if (points.length < 12) {
        var local = recentPoints(pointsFromRows(historyRows(area), area));
        if (local.length > points.length) points = local;
      }
      return points;
    }
    function drawAllAreas(rows) {
      buildAreaSections();
      var pending = [];
      AREA_ORDER.forEach(function (area, index) {
        var points = areaPoints(rows, area);
        if (points.length < 12) pending.push(index);
        drawAreaChart(points, areaCfg(index));
      });
      if (pending.length) {
        loadOecdHistory().then(function (map) {
          pending.forEach(function (index) {
            var area = AREA_ORDER[index];
            var points = recentPoints(pointsFromRows(map[area] || [], area));
            if (points.length >= 12) drawAreaChart(points, areaCfg(index));
          });
        }).catch(function () {});
      }
    }
    function show(rows, message) {
      var series = seriesFrom(rows);
      if (!series.length) throw new Error("empty");
      draw(series);
      drawAllAreas(rows);
      document.getElementById("clock-status").textContent = message || "";
    }
    function bindUpdate() {
      var status = document.getElementById("clock-status");
      var updateBtn = document.getElementById("update-btn");
      if (!status || !updateBtn || updateBtn.dataset.bound === "1") return;
      updateBtn.dataset.bound = "1";
      function refresh(note) {
        updateBtn.disabled = true;
        note.textContent = "Supabase에서 불러오는 중…";
        return loadSupabase().then(function (rows) {
          if (!rows || !rows.length) throw new Error("empty");
          show(rows, "");
        }).catch(function (err) {
          var reason = err && err.message ? err.message : "오류";
          note.textContent = reason === "empty"
            ? "Supabase 표에 읽을 수 있는 행이 없습니다. 표 권한(RLS)에서 anon 읽기를 허용해 주세요."
            : "Supabase에서 읽지 못했습니다 (" + reason + ").";
        }).then(function () {
          updateBtn.disabled = false;
        });
      }
      refresh(status);
      updateBtn.addEventListener("click", function () {
        refresh(document.getElementById("clock-status"));
      });
    }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", bindUpdate);
    else bindUpdate();
  </script>
