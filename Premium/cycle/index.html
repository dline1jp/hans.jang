    }
    function drawG20(points) {
      var svg = document.getElementById("clock-g20");
      if (!svg) return;
      while (svg.firstChild) svg.removeChild(svg.firstChild);
      var status = document.getElementById("g20-status");
      var asof = document.getElementById("g20-asof");
      if (!points || points.length < 2) {
        if (status) status.textContent = "G20 이력 데이터를 불러오는 중입니다… (Supabase에 G20 이력이 없으면 OECD 원본에서 불러옵니다.)";
        return;
      }
      if (status) status.textContent = "";
      points = points.filter(function (point) {
        return point && isFinite(point.obs) && isFinite(point.mom) && point.key >= G20_START_KEY;
      });
      if (points.length < 2) {
        if (status) status.textContent = "G20 이력 데이터를 표시할 수 없습니다.";
        return;
      }
      var plot = { left: 46, top: 36, right: 500, bottom: 710 };
      plot.w = plot.right - plot.left;
      plot.h = plot.bottom - plot.top;
      var maxObs = 0.5;
      points.forEach(function (point) {
        maxObs = Math.max(maxObs, Math.abs(point.obs - 100));
      });
      var obsAbs = Math.ceil(maxObs * 1.05 * 2) / 2;
      var momAbs = 0.3;
      function xOf(value) { return plot.left + ((value - (100 - obsAbs)) / (obsAbs * 2)) * plot.w; }
      function yOf(mom) {
        var y = plot.top + ((momAbs - mom) / (momAbs * 2)) * plot.h;
        if (y < plot.top) return plot.top;
        if (y > plot.bottom) return plot.bottom;
        return y;
      }
      var cx = xOf(100);
      var cy = yOf(0);
      var zones = [
        { x: plot.left, y: plot.top, w: cx - plot.left, h: cy - plot.top, fill: "#d4edc4", title: "회복", tx: plot.left + 16, ty: plot.top + 28, anchor: "start", fillText: "#1f7a32" },
        { x: cx, y: plot.top, w: plot.right - cx, h: cy - plot.top, fill: "#d5e4f7", title: "확장", tx: plot.right - 16, ty: plot.top + 28, anchor: "end", fillText: "#3d5678" },
        { x: plot.left, y: cy, w: cx - plot.left, h: plot.bottom - cy, fill: "#e4e6ea", title: "수축", tx: plot.left + 16, ty: plot.bottom - 18, anchor: "start", fillText: "#4e555c" },
        { x: cx, y: cy, w: plot.right - cx, h: plot.bottom - cy, fill: "#f8e6c4", title: "둔화", tx: plot.right - 16, ty: plot.bottom - 18, anchor: "end", fillText: "#8a5a28" }
      ];
      zones.forEach(function (zone) {
        svg.appendChild(svgEl("rect", { x: zone.x, y: zone.y, width: zone.w, height: zone.h, fill: zone.fill }));
        var zoneLabel = svgEl("text", { x: zone.tx, y: zone.ty, fill: zone.fillText, "font-size": "26", "font-weight": "700", "text-anchor": zone.anchor });
        zoneLabel.textContent = zone.title;
        svg.appendChild(zoneLabel);
      });
      svg.appendChild(svgEl("line", { x1: cx, y1: plot.top, x2: cx, y2: plot.bottom, stroke: "#c5c9ce", "stroke-width": "1.2" }));
      svg.appendChild(svgEl("line", { x1: plot.left, y1: cy, x2: plot.right, y2: cy, stroke: "#c5c9ce", "stroke-width": "1.2" }));
      var momStep = momAbs > 2 ? 1 : (momAbs > 0.6 ? 0.2 : 0.1);
      for (var tick = -momAbs; tick <= momAbs + 0.001; tick += momStep) {
        var rounded = Math.round(tick * 10) / 10;
        if (Math.abs(rounded) < 0.001) continue;
        var tickText = svgEl("text", { x: plot.left - 8, y: yOf(rounded) + 4, fill: "#8b939c", "font-size": "11", "text-anchor": "end" });
        tickText.textContent = (rounded > 0 ? "+" : "") + rounded.toFixed(1);
        svg.appendChild(tickText);
      }
      var obsStep = obsAbs > 4 ? 2 : (obsAbs > 1.5 ? 1 : 0.5);
      for (var step = -obsAbs; step <= obsAbs + 0.001; step += obsStep) {
        var obsTick = Math.round((100 + step) * 10) / 10;
        if (Math.abs(obsTick - 100) < 0.001) continue;
        var obsText = svgEl("text", { x: xOf(obsTick), y: plot.bottom + 20, fill: "#8b939c", "font-size": "11", "text-anchor": "middle" });
        obsText.textContent = obsTick % 1 === 0 ? obsTick.toFixed(0) : obsTick.toFixed(1);
        svg.appendChild(obsText);
      }
      var color = COLOR.G20 || "#5c6b7a";
      var group = svgEl("g", { class: "series" });
      group.dataset.area = "G20";
      group.appendChild(svgEl("polyline", {
        points: points.map(function (point) { return xOf(point.obs).toFixed(1) + "," + yOf(point.mom).toFixed(1); }).join(" "),
        fill: "none",
        stroke: color,
        "stroke-width": "1.6",
        "stroke-linecap": "round",
        "stroke-linejoin": "round"
      }));
      points.forEach(function (point, index) {
        var tip = svgEl("title");
        tip.textContent = "G20 " + point.year + "." + point.month + "  경기선행지수 " + point.obs.toFixed(2) + "  전월대비차 " + (point.mom > 0 ? "+" : "") + point.mom.toFixed(2) + "%";
        if (index === points.length - 1) {
          var prev = points[index - 1] || point;
          var arrow = directionArrow(xOf(prev.obs), yOf(prev.mom), xOf(point.obs), yOf(point.mom), color, point.mom);
          arrow.appendChild(tip);
          group.appendChild(arrow);
          return;
        }
        var dot = svgEl("circle", { cx: xOf(point.obs).toFixed(1), cy: yOf(point.mom).toFixed(1), r: "2.6", fill: color });
        dot.appendChild(tip);
        group.appendChild(dot);
      });
      svg.appendChild(group);
      var janMarks = [];
      points.forEach(function (point) {
        if (point.month !== 1) return;
        janMarks.push({ year: point.year, month: point.month, x: xOf(point.obs), y: yOf(point.mom) });
      });
      janMarks.sort(function (a, b) { return a.x - b.x; });
      var placedYears = [];
      var yearHalf = 26;
      janMarks.forEach(function (item) {
        var labelX = item.x;
        if (labelX < plot.left + yearHalf) labelX = plot.left + yearHalf;
        if (labelX > plot.right - yearHalf) labelX = plot.right - yearHalf;
        function yearClash(px, py) {
          return placedYears.some(function (box) {
            return Math.abs(box.x - px) < yearHalf * 2 && Math.abs(box.y - py) < 16;
          });
        }
        var labelY = item.y - 12;
        if (labelY < plot.top + 16 || yearClash(labelX, labelY)) labelY = item.y + 20;
        if (yearClash(labelX, labelY)) labelY = item.y + 38;
        placedYears.push({ x: labelX, y: labelY });
        svg.appendChild(svgEl("circle", {
          cx: item.x.toFixed(1),
          cy: item.y.toFixed(1),
          r: "5",
          fill: "none",
          stroke: "#243041",
          "stroke-width": "2"
        }));
        var yearText = svgEl("text", {
          x: labelX.toFixed(1),
          y: labelY.toFixed(1),
          fill: "#243041",
          "font-size": "13",
          "font-weight": "700",
          "text-anchor": "middle",
          "paint-order": "stroke",
          stroke: "#f6f5f1",
          "stroke-width": "4",
          "stroke-linejoin": "round"
        });
        yearText.textContent = item.year + "." + String(item.month).padStart(2, "0");
        svg.appendChild(yearText);
      });
      var first = points[0];
      var latest = points[points.length - 1];
      var labelX = xOf(latest.obs) + 12;
      var labelY = yOf(latest.mom) + 6;
      if (labelX + 70 > plot.right - 6) labelX = xOf(latest.obs) - 70;
      if (labelY < plot.top + 30) labelY = plot.top + 30;
      if (labelY > plot.bottom - 10) labelY = plot.bottom - 10;
      var label = svgEl("text", {
        x: labelX.toFixed(1),
        y: labelY.toFixed(1),
        fill: color,
        "font-size": "24",
        "font-weight": "700",
        "paint-order": "stroke",
        stroke: "#f6f5f1",
        "stroke-width": "4",
        "stroke-linejoin": "round"
      });
      label.textContent = "G20";
      svg.appendChild(label);
      var watermark = svgEl("g", { "pointer-events": "none" });
      [132, 314, 497, 679].forEach(function (markY) {
        var mark = svgEl("text", {
          x: "260",
          y: String(markY),
          fill: "#243041",
          "fill-opacity": "0.22",
          "font-size": "18",
          "font-weight": "700",
          "text-anchor": "middle",
          transform: "rotate(-24 260 " + markY + ")"
        });
        mark.textContent = "출처 네이버 프리미엄 콘텐츠 버핏2배랩";
        watermark.appendChild(mark);
      });
      svg.appendChild(watermark);
      if (asof) {
        asof.textContent = first.year + "." + String(first.month).padStart(2, "0") + " ~ " + latest.year + "." + String(latest.month).padStart(2, "0");
      }
    }
    function loadSupabase() {
      return fetch(SUPABASE_URL + "/rest/v1/hangjang-table?select=reference_area,time_period,obs_value,mom", {
        headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY }
      }).then(function (res) {
        if (!res.ok) throw new Error(String(res.status));
        return res.json();
      });
    }
    function show(rows, message) {
      var series = seriesFrom(rows);
      if (!series.length) throw new Error("empty");
      draw(series);
      var g20 = g20SeriesFrom(rows);
      if (g20.length < 12) {
        var local = g20SeriesFrom(g20HistoryRows());
        if (local.length > g20.length) g20 = local;
      }
      drawG20(g20);
      if (g20.length < 12) {
        loadG20History().then(function (full) {
          var points = g20SeriesFrom(full);
          if (points.length > g20.length) drawG20(points);
        }).catch(function () {});
      }
      document.getElementById("clock-status").textContent = message || "";
    }
    function bindUpdate() {
      var status = document.getElementById("clock-status");
      var updateBtn = document.getElementById("update-btn");
      if (!status || !updateBtn || updateBtn.dataset.bound === "1") return;
      updateBtn.dataset.bound = "1";
      function refresh(note) {
        updateBtn.disabled = true;
        note.textContent = "Supabase에서 불러오는 중…";
        return loadSupabase().then(function (rows) {
          if (!rows || !rows.length) throw new Error("empty");
          show(rows, "");
        }).catch(function (err) {
          var reason = err && err.message ? err.message : "오류";
          note.textContent = reason === "empty"
            ? "Supabase 표에 읽을 수 있는 행이 없습니다. 표 권한(RLS)에서 anon 읽기를 허용해 주세요."
            : "Supabase에서 읽지 못했습니다 (" + reason + ").";
        }).then(function () {
          updateBtn.disabled = false;
        });
      }
      refresh(status);
      updateBtn.addEventListener("click", function () {
        refresh(document.getElementById("clock-status"));
      });
    }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", bindUpdate);
    else bindUpdate();
  </script>
