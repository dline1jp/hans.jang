<!DOCTYPE html>
<html lang="ko">
<head>
  <script src="/Premium/gate.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>일봉 200일선</title>
  <style>
    body { background: #111; color: #fff; font-family: "Malgun Gothic", "Apple SD Gothic Neo", Arial, sans-serif; margin: 0; padding: 16px; }
    a { color: #4da3ff; }
    .home { color: #D8C0FF; font-size: 22px; text-decoration: none; }
    h1 { text-align: center; color: #FFFFE0; font-size: 28px; line-height: 1.35; }
    .note { max-width: 980px; margin: 8px auto; color: #ccc; font-size: 18px; line-height: 1.55; }
    .ma-legend { max-width: 980px; margin: 8px auto; color: #ccc; font-size: 16px; }
    .ma-legend i { display: inline-block; width: 28px; height: 3px; margin: 0 6px 0 14px; vertical-align: middle; }
    .ma-legend i.ma200 { background: #E53935; }
    .ma-legend i.mapx { background: #bbbbbb; }
    canvas { display: block; width: 100%; max-width: 1100px; height: 520px; margin: 12px auto; background: #0c0c0c; border: 1px solid #333; }
  </style>
</head>
<body>
  <p><a class="home" href="/Premium/hansjang/DRIP/index.html">← 버핏 적립보유법</a></p>
  <h1 id="title">일봉 200일선</h1>
  <p class="ma-legend"><i class="ma200"></i>200일 단순이동평균 <i class="mapx"></i>일봉 종가</p>
  <p class="note" id="meta"></p>
  <canvas id="chart" width="1100" height="520"></canvas>
  <script src="chart-data.js"></script>
  <script>
  (function () {
    var params = new URLSearchParams(location.search);
    var symbol = params.get("symbol") || "";
    var title = document.getElementById("title");
    var meta = document.getElementById("meta");
    var canvas = document.getElementById("chart");
    var series = (window.DRIP_DAILY || {})[symbol];
    title.textContent = symbol ? (symbol + " · 일봉 200일선") : "일봉 200일선";
    if (!series || series.length < 200) {
      meta.textContent = "이 종목의 일봉 데이터가 없습니다.";
      return;
    }
    function average(index) {
      var sum = 0;
      for (var i = index - 199; i <= index; i++) sum += series[i];
      return sum / 200;
    }
    var last = series.length - 1;
    var ma = average(last);
    meta.textContent = "일봉 종가 " + Math.round(series[last]).toLocaleString("ko-KR")
      + " · 200일선 " + Math.round(ma).toLocaleString("ko-KR");
    function draw() {
      var width = Math.max(320, canvas.clientWidth || 980);
      var height = 520;
      var dpr = window.devicePixelRatio || 1;
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      canvas.style.height = height + "px";
      var ctx = canvas.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, width, height);
      var points = [];
      var lo = Infinity;
      var hi = -Infinity;
      for (var i = 199; i < series.length; i++) {
        var line = average(i);
        points.push([series[i], line]);
        if (series[i] < lo) lo = series[i];
        if (series[i] > hi) hi = series[i];
        if (line < lo) lo = line;
        if (line > hi) hi = line;
      }
      var pad = (hi - lo) * 0.06 || 1;
      lo -= pad;
      hi += pad;
      function x(index) {
        return 8 + (index / Math.max(1, points.length - 1)) * (width - 16);
      }
      function y(value) {
        return 16 + (hi - value) / (hi - lo) * (height - 36);
      }
      function stroke(column, color, lineWidth) {
        ctx.beginPath();
        for (var j = 0; j < points.length; j++) {
          var px = x(j);
          var py = y(points[j][column]);
          if (j === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.strokeStyle = color;
        ctx.lineWidth = lineWidth;
        ctx.lineJoin = "round";
        ctx.stroke();
      }
      stroke(1, "#E53935", 2.2);
      stroke(0, "#bbbbbb", 1.2);
      ctx.fillStyle = "#888";
      ctx.font = "13px Arial";
      ctx.fillText(Math.round(hi).toLocaleString("ko-KR"), 8, 16);
      ctx.fillText(Math.round(lo).toLocaleString("ko-KR"), 8, height - 8);
    }
    draw();
    var timer = null;
    window.addEventListener("resize", function () {
      if (timer) clearTimeout(timer);
      timer = setTimeout(draw, 150);
    });
  })();
  </script>
</body>
</html>
