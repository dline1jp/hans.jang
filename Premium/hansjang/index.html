<!DOCTYPE html>
<html>
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>한스장 타점</title>
  <style>
    body { background: #111; color: #fff; font-family: "Malgun Gothic", "Apple SD Gothic Neo", Arial, sans-serif; margin: 0; padding: 30px; }

    .home { font-size: 42px; }

    .hub a.card:hover { border-color: #8a6844; background: #26160f; }
    @media (max-width: 800px) {
      body { padding: 12px; }
      .home { font-size: 22px; }
      h1 { font-size: 26px; }
      .note { font-size: 16px; }
      .hub a.card { font-size: 20px; padding: 16px; }
      .hub a.card span { font-size: 14px; }
