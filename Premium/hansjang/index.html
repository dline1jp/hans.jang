<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="/Premium/gate.js"></script>
  <title>한스장 타점</title>
  <style>
    body { background: #111; color: #fff; font-family: "Malgun Gothic", "Apple SD Gothic Neo", Arial, sans-serif; margin: 0; padding: 16px; }
    .topbar { display: flex; align-items: stretch; justify-content: center; flex-wrap: wrap; gap: 0; max-width: 1100px; margin: 0 auto 18px; background: #1a4fbf; border-radius: 6px; overflow: hidden; }
    .topbar > a, .menu-slot { flex: 0 1 auto; border-right: 1px solid rgba(255,255,255,0.28); border-bottom: 1px solid rgba(255,255,255,0.28); }
    .menu-slot { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
    .menu-horizon { color: #d7e6ff; font-size: 15px; font-weight: 600; line-height: 1.35; text-align: center; max-width: 16em; margin: 8px 10px 0; }
    .topbar-link { display: inline-flex; align-items: center; justify-content: center; min-width: 0; height: auto; min-height: 52px; padding: 12px 18px; margin: 0; border: 0; border-radius: 0; background: transparent; color: #fff; font-size: 24px; font-weight: 700; text-decoration: none; white-space: nowrap; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; box-shadow: none; }
    .topbar-link:hover { background: rgba(255,255,255,0.16); color: #fff; }
    .topbar-link:active { background: rgba(0,0,0,0.16); color: #fff; }
    h1 { text-align: center; color: #FFFFE0; font-size: 32px; line-height: 1.35; margin: 4px 0 12px; }
    .note { color: #ccc; font-size: 18px; line-height: 1.5; max-width: 1100px; margin: 0 auto 16px; }
    .summary { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; max-width: 1100px; margin: 0 auto; }
    .stock-card { border: 1px solid #444; border-radius: 12px; padding: 14px 16px; }
    .stock-card.miss { background: #1c1c1c; }
    .stock-card.buy { background: #16301f; }
    .stock-card.wait { background: #2a2410; }
    .stock-card h2 { margin: 0 0 8px; font-size: 22px; color: #FFFFE0; }
    .stock-card.miss h2 { color: #f7dc6f; }
    .stock-card.buy h2 { color: #7dcea0; }
    .stock-card.wait h2 { color: #f7dc6f; }
    .stock-meta { margin: 0 0 8px; font-size: 17px; color: #D8C0FF; }
    .stock-desc { margin: 0 0 10px; font-size: 15px; line-height: 1.5; color: #ddd; }
    .ma-legend { margin: 0 0 8px; font-size: 14px; color: #bbb; }
    .ma-legend i { display: inline-block; width: 18px; height: 3px; margin-right: 6px; vertical-align: middle; }
    .ma-legend i.ma200 { background: #E53935; }
    .ma-legend i.mapx { background: #9aa0a6; margin-left: 12px; }
    .mini-canvas { display: block; width: 100%; height: 220px; background: #0c0c0c; border: 1px solid #333; border-radius: 8px; }
    .jump { margin: 10px 0 0; font-size: 15px; }
    @media (max-width: 800px) {
      html, body { overflow-x: hidden; max-width: 100%; }
      .topbar { max-width: 100%; }
      .topbar > a, .menu-slot { flex: 1 1 46%; }
      .menu-slot { max-width: none; align-items: center; }
      .menu-horizon { max-width: none; font-size: 12px; }
      .topbar-link { font-size: 15px; min-width: 0; max-width: 100%; width: auto; height: auto; min-height: 40px; padding: 8px 10px; margin: 0; box-sizing: border-box; white-space: normal; text-align: center; }
      h1 { font-size: 22px; }
      .note { font-size: 15px; }
      .summary { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <span class="menu-slot"><span class="menu-horizon">시크리컬 장기(주봉 200주 이평 접근 시, 단 버블기는 예외)</span><a class="topbar-link" href="200W/index.html">한스장 시크리컬 200주 매수타점</a></span>
  </div>
  <h1>한스장 시크리컬 200주 매수타점(단 버블기는 예외)</h1>
  <!-- NOTE_START -->
  <p class="note">기준일 2026-11-20. 시세가 200주 이동평균선에 접근할수록 확률이 높아지고, 200주선 아래로 내려오면 100%입니다. 시세가 200주선에 내려오면 분할 매수를 검토할 수 있습니다. </p>
  <!-- NOTE_END -->
  <div id="summary" class="summary"></div>
  <script src="summary-data.js"></script>
  <script src="mini-chart.js"></script>
</body>
</html>
