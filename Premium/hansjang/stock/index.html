<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="/Premium/gate.js"></script>
  <title>종목 정보</title>
  <style>
    body { background: #111; color: #fff; font-family: "Malgun Gothic", "Apple SD Gothic Neo", Arial, sans-serif; margin: 0; padding: 16px; }
    a { color: #4da3ff; }
    .home { color: #D8C0FF; font-size: 20px; text-decoration: none; }
    .wrap { max-width: 1100px; margin: 0 auto; }
    .search { display: flex; gap: 8px; margin: 12px 0 16px; }
    .search input { flex: 1; min-width: 0; background: #1a1a1a; color: #fff; border: 1px solid #555; border-radius: 8px; padding: 10px 12px; font-size: 16px; }
    .search button { background: #1a4fbf; color: #fff; border: 0; border-radius: 8px; padding: 10px 18px; font-size: 16px; font-weight: 700; cursor: pointer; }
    .card { background: #181818; border: 1px solid #444; border-radius: 12px; padding: 14px; margin: 0 0 14px; }
    .sym { font-size: 15px; color: #9cc; }
    .nm { font-size: 26px; color: #FFFFE0; margin: 2px 0 8px; line-height: 1.3; }
    .px { font-size: 40px; font-weight: 700; }
    .chg { font-size: 22px; font-weight: 700; margin-left: 10px; }
    .up { color: #7dcea0; }
    .down { color: #f1948a; }
    .sub { color: #aaa; font-size: 14px; line-height: 1.6; margin-top: 8px; }
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 14px; }
    .tabs a { background: #1a1a1a; border: 1px solid #555; border-radius: 8px; padding: 7px 14px; color: #ddd; font-weight: 700; text-decoration: none; font-size: 15px; }
    .tabs a:hover { border-color: #4da3ff; color: #fff; }
    h2 { color: #FFFFE0; font-size: 20px; margin: 0 0 10px; }
    .grid2 { display: grid; grid-template-columns: 1.5fr 1fr; gap: 14px; align-items: start; }
    .ranges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
    .ranges button { background: #1a1a1a; color: #ddd; border: 1px solid #555; border-radius: 6px; padding: 4px 10px; font-size: 13px; cursor: pointer; }
    .ranges button.on { background: #24406e; border-color: #4da3ff; color: #fff; }
    .ctrls { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
    .ctrls button { background: #1a1a1a; color: #ddd; border: 1px solid #555; border-radius: 6px; padding: 5px 12px; font-size: 13px; cursor: pointer; }
    .ctrls button:hover { border-color: #4da3ff; color: #fff; }
    .ctrls button.on { background: #24406e; border-color: #4da3ff; color: #fff; }
    .ctrls .hint { color: #777; font-size: 12px; margin-left: 6px; }
    #chart { touch-action: none; }
    details summary { list-style: revert; }
    svg.chart { width: 100%; height: auto; display: block; background: #0c0c0c; border-radius: 8px; }
    table.kv { width: 100%; border-collapse: collapse; font-size: 14px; }
    table.kv td { padding: 7px 2px; border-bottom: 1px solid #2a2a2a; }
    table.kv td:first-child { color: #9cc; }
    table.kv td:last-child { text-align: right; font-weight: 700; }
    .bar-row { display: flex; align-items: center; gap: 8px; margin: 5px 0; font-size: 13px; }
    .bar-row .lbl { width: 88px; flex: 0 0 auto; color: #9cc; }
    .bar-row .track { flex: 1; height: 16px; background: #222; border-radius: 4px; overflow: hidden; display: flex; }
    .bar-row .track i { display: block; height: 100%; }
    .bar-row .val { width: 96px; flex: 0 0 auto; text-align: right; }
    .g { display: inline-block; min-width: 40px; text-align: center; padding: 2px 8px; border-radius: 6px; font-weight: 800; font-size: 13px; color: #111; }
    .g.a { background: #2e7d5b; color: #fff; }
    .g.b { background: #7dcea0; }
    .g.c { background: #f7dc6f; }
    .g.d { background: #f0a05a; }
    .g.f { background: #ef5350; color: #fff; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 820px) { .grid2, .two { grid-template-columns: 1fr; } .nm { font-size: 21px; } .px { font-size: 30px; } }
    .tip { position: fixed; pointer-events: none; background: #000d; border: 1px solid #666; border-radius: 8px; padding: 6px 10px; font-size: 12px; line-height: 1.5; display: none; z-index: 9; white-space: nowrap; }
    .msg { color: #ffd76a; font-size: 16px; line-height: 1.6; }
  </style>
</head>
<body>
<div class="wrap">
  <p><a class="home" href="../index.html">← 한스장 타점</a></p>
  <form class="search" id="sform" autocomplete="off">
    <input id="q" list="tickers" placeholder="종목명·티커 검색 (예: 삼성전자, NVDA, 005930, SOXL)" aria-label="종목명 또는 티커 검색">
    <datalist id="tickers"></datalist>
    <button type="submit">검색</button>
  </form>
  <div id="app"></div>
</div>
<div class="tip" id="tip"></div>
<script>
(function () {
  var NS = "http://www.w3.org/2000/svg";
  var tip = document.getElementById("tip");
  var app = document.getElementById("app");
  var q = document.getElementById("q");
  var dl = document.getElementById("tickers");

  function esc(s) { return String(s === null || s === undefined ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function escAttr(s) { return esc(s).replace(/"/g, "&quot;"); }

  var KO_CACHE = {};
  try {
    var storedKo = localStorage.getItem("hans-ko");
    if (storedKo) { KO_CACHE = JSON.parse(storedKo); }
  } catch (e) { KO_CACHE = {}; }

  function translateText(text) {
    var key = String(text || "").slice(0, 250);
    if (!key) { return Promise.resolve(""); }
    if (KO_CACHE[key]) { return Promise.resolve(KO_CACHE[key]); }
    var url = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ko&dt=t&q=" + encodeURIComponent(text.slice(0, 1200));
    return fetch(url).then(function (r) {
      if (!r.ok) { throw new Error("tr"); }
      return r.json();
    }).then(function (payload) {
      var out = "";
      (payload[0] || []).forEach(function (part) { if (part && part[0]) { out += part[0]; } });
      out = out.trim();
      if (!out) { throw new Error("tr"); }
      KO_CACHE[key] = out;
      try { localStorage.setItem("hans-ko", JSON.stringify(KO_CACHE)); } catch (e) { /* ignore */ }
      return out;
    }).catch(function () { return ""; });
  }

  function fillKo(root) {
    var nodes = root.querySelectorAll("[data-en]");
    Array.prototype.forEach.call(nodes, function (node) {
      translateText(node.getAttribute("data-en")).then(function (korean) {
        if (korean) { node.textContent = korean; node.removeAttribute("data-en"); }
      });
    });
  }

  function knownName(ticker) {
    for (var i = 0; i < INDEX.length; i++) {
      if (INDEX[i].t === ticker && INDEX[i].k) { return INDEX[i].k; }
    }
    return null;
  }
  function isNum(v) { return v !== null && v !== undefined && v !== "" && !isNaN(v); }
  function num(v, d) { if (!isNum(v)) { return "-"; } var n = (d === undefined ? 2 : d); return Number(v).toLocaleString("en-US", { minimumFractionDigits: n, maximumFractionDigits: n }); }

    if (s >= 1e9) { return sign + (s / 1e9).toFixed(2) + "B"; }
    if (s >= 1e6) { return sign + (s / 1e6).toFixed(2) + "M"; }

    return n;
  }
  function svgBox(host, w, h) {

    while (s.firstChild) { s.removeChild(s.firstChild); }
    s.setAttribute("viewBox", "0 0 " + w + " " + h);
    return s;
  }
  function tipOn(ev, html) {

    tip.style.left = (ev.clientX + 14) + "px";
    tip.style.top = (ev.clientY + 14) + "px";
    tip.innerHTML = html;
  }
  function sma(vals, n) {
    var out = new Array(vals.length), sum = 0, i;
    for (i = 0; i < vals.length; i++) { sum += vals[i]; if (i >= n) { sum -= vals[i - n]; } out[i] = i >= n - 1 ? sum / n : null; }

  function ema(vals, n) {

    out[n - 1] = sum / n;
    for (i = n; i < vals.length; i++) { out[i] = vals[i] * k + out[i - 1] * (1 - k); }
    return out;

  function rsiOf(vals, n) {

    for (i = 1; i <= n; i++) { d = vals[i] - vals[i - 1]; if (d >= 0) { ag += d; } else { al -= d; } }

    for (i = n + 1; i < vals.length; i++) {

      ag = (ag * (n - 1) + Math.max(d, 0)) / n;
      al = (al * (n - 1) + Math.max(-d, 0)) / n;
      out[i] = al === 0 ? 100 : 100 - 100 / (1 + ag / al);

    return out;
  }

  function macdOf(vals, f, s, sig) {
    var ef = ema(vals, f), es = ema(vals, s), i;
    var line = new Array(vals.length), idx = [], sub = [];
    for (i = 0; i < vals.length; i++) {
      line[i] = (ef[i] === null || es[i] === null) ? null : ef[i] - es[i];
      if (line[i] !== null) { idx.push(i); sub.push(line[i]); }
    }
    var sigSub = ema(sub, sig);
    var signal = new Array(vals.length), hist = new Array(vals.length);
    for (i = 0; i < vals.length; i++) { signal[i] = null; hist[i] = null; }
    for (i = 0; i < sub.length; i++) { signal[idx[i]] = sigSub[i]; }
    for (i = 0; i < vals.length; i++) { if (line[i] !== null && signal[i] !== null) { hist[i] = line[i] - signal[i]; } }
    return { line: line, signal: signal, hist: hist };
  }

  function seriesFrom(ch) {
    ch = ch || {};
    var base = ch.d0 ? new Date(ch.d0 + "T00:00:00Z") : new Date();
    var dates = (ch.dd || []).map(function (off) { return new Date(base.getTime() + off * 86400000).toISOString().slice(0, 10); });
    var close = ch.c || [];
    return {
      dates: dates, close: close, vol: ch.v || [],
      ma20: sma(close, 20), ma50: sma(close, 50), ma200: sma(close, 200),
      rsi: rsiOf(close, 14), macd: macdOf(close, 12, 26, 9)
    };
  }

  var CH = { daily: null, weekly: null, series: null, host: null, i0: 0, i1: 0, drag: null, mode: "d" };
  function drawChart() {
    var s = CH.series, host = CH.host;
    if (!s || !s.close.length) { return; }
    var total = s.close.length;
    var W = 1000, L = 8, R = 58, H = 730;
    var x0 = L, x1 = W - R;
    var P = { t: 24, b: 400 }, V = { t: 418, b: 486 }, RI = { t: 506, b: 604 }, MG = { t: 624, b: 700 };
    var i0 = Math.max(0, Math.floor(CH.i0));
    var i1 = Math.min(total - 1, Math.ceil(CH.i1));
    if (i1 - i0 < 8) { i1 = Math.min(total - 1, i0 + 8); }
    var n = i1 - i0 + 1;
    var lo = Infinity, hi = -Infinity, k, q;
    function take(x) { if (x !== null && x !== undefined && isFinite(x)) { if (x < lo) { lo = x; } if (x > hi) { hi = x; } } }
    var mas = [s.ma20, s.ma50, s.ma200];
    for (k = i0; k <= i1; k++) {
      take(s.close[k]);
      for (q = 0; q < 3; q++) { take(mas[q][k]); }
    }
    if (!isFinite(lo)) { lo = 0; hi = 1; }
    var padv = (hi - lo) * 0.06 || 1; lo -= padv; hi += padv;
    function X(i) { return x0 + (x1 - x0) * (n < 2 ? 0.5 : (i - i0) / (n - 1)); }
    function Y(v) { return P.b - (v - lo) / (hi - lo) * (P.b - P.t); }
    var vmax = 0;
    for (k = i0; k <= i1; k++) { if (s.vol[k] > vmax) { vmax = s.vol[k]; } }
    function YV(v) { return V.b - (vmax ? (v / vmax) * (V.b - V.t) : 0); }
    var mlo = 0, mhi = 0;
    for (k = i0; k <= i1; k++) {
      var mv = [s.macd.line[k], s.macd.signal[k], s.macd.hist[k]];
      for (q = 0; q < 3; q++) { if (mv[q] !== null && mv[q] !== undefined && isFinite(mv[q])) { if (mv[q] < mlo) { mlo = mv[q]; } if (mv[q] > mhi) { mhi = mv[q]; } } }
    }
    var mpad = (mhi - mlo) * 0.12 || 1; mlo -= mpad; mhi += mpad;
    function YM(v) { return MG.b - (v - mlo) / (mhi - mlo) * (MG.b - MG.t); }
    function YI(v) { return RI.b - (v / 100) * (RI.b - RI.t); }

    var svg = svgBox(host, W, H);
    [P, V, RI, MG].forEach(function (p) { svg.appendChild(ns("rect", { x: x0, y: p.t, width: x1 - x0, height: p.b - p.t, fill: "#0a0a0a", stroke: "#242424" })); });
    for (k = 0; k <= 4; k++) {
      var yy = P.t + (P.b - P.t) * k / 4;
      svg.appendChild(ns("line", { x1: x0, y1: yy, x2: x1, y2: yy, stroke: "#1c1c1c" }));
      svg.appendChild(ns("text", { x: x1 + 5, y: yy + 4, fill: "#999", "font-size": 12 }, num(hi - (hi - lo) * k / 4)));
    }
    [30, 70].forEach(function (lv) {
      svg.appendChild(ns("line", { x1: x0, y1: YI(lv), x2: x1, y2: YI(lv), stroke: lv === 30 ? "#6e3434" : "#34603a", "stroke-dasharray": "4 3" }));
      svg.appendChild(ns("text", { x: x1 + 5, y: YI(lv) + 4, fill: "#999", "font-size": 12 }, lv));
    });
    svg.appendChild(ns("line", { x1: x0, y1: YM(0), x2: x1, y2: YM(0), stroke: "#333" }));
    var bw = Math.max(1, (x1 - x0) / n - 0.6);
    for (k = i0; k <= i1; k++) {
      var upV = s.close[k] >= (k > 0 ? s.close[k - 1] : s.close[k]);
      svg.appendChild(ns("rect", { x: X(k) - bw / 2, y: YV(s.vol[k]), width: bw, height: Math.max(1, V.b - YV(s.vol[k])), fill: upV ? "#2c5a44" : "#5a2c2c" }));
    }
    var dp = "";
    for (k = i0; k <= i1; k++) { dp += (k === i0 ? "M" : "L") + X(k).toFixed(1) + " " + Y(s.close[k]).toFixed(1) + " "; }
    svg.appendChild(ns("path", { d: dp, fill: "none", stroke: "#5aa9e6", "stroke-width": 1.8 }));
    [["ma20", "#f7dc6f", 1.4], ["ma50", "#7dcea0", 1.4], ["ma200", "#f1948a", 1.7]].forEach(function (m) {
      var arr = s[m[0]], dd = "";
      for (k = i0; k <= i1; k++) {
        if (arr[k] === null || arr[k] === undefined) { continue; }
        dd += ((dd === "" || arr[k - 1] === null || arr[k - 1] === undefined) ? "M" : "L") + X(k).toFixed(1) + " " + Y(arr[k]).toFixed(1) + " ";
      }
      if (dd) { svg.appendChild(ns("path", { d: dd, fill: "none", stroke: m[1], "stroke-width": m[2] })); }
    });
    var dr = "";
    for (k = i0; k <= i1; k++) {
      if (s.rsi[k] === null || s.rsi[k] === undefined) { continue; }
      dr += (dr === "" ? "M" : "L") + X(k).toFixed(1) + " " + YI(s.rsi[k]).toFixed(1) + " ";
    }
    if (dr) { svg.appendChild(ns("path", { d: dr, fill: "none", stroke: "#f7dc6f", "stroke-width": 1.5 })); }
    for (k = i0; k <= i1; k++) {
      var hh = s.macd.hist[k];
      if (hh === null || hh === undefined) { continue; }
      var my0 = YM(0), my1 = YM(hh);
      svg.appendChild(ns("rect", { x: X(k) - bw / 2, y: Math.min(my0, my1), width: bw, height: Math.max(1, Math.abs(my1 - my0)), fill: hh >= 0 ? "#2c5a44" : "#5a2c2c" }));
    }
    [["line", "#5aa9e6"], ["signal", "#f7a35c"]].forEach(function (m) {
      var arr = s.macd[m[0]], dd = "";
      for (k = i0; k <= i1; k++) {
        if (arr[k] === null || arr[k] === undefined) { continue; }
        dd += ((dd === "" || arr[k - 1] === null) ? "M" : "L") + X(k).toFixed(1) + " " + YM(arr[k]).toFixed(1) + " ";
      }
      if (dd) { svg.appendChild(ns("path", { d: dd, fill: "none", stroke: m[1], "stroke-width": 1.4 })); }
    });
    [["주가 " + (CH.mode === "w" ? "주봉" : "일봉"), P.t], ["거래량", V.t], ["RSI(14)", RI.t], ["MACD(12,26,9)", MG.t]].forEach(function (lab) {
      svg.appendChild(ns("text", { x: x0 + 5, y: lab[1] + 15, fill: "#777", "font-size": 12 }, lab[0]));
    });
    var lx = x0 + 60;
    [["MA20", "#f7dc6f"], ["MA50", "#7dcea0"], ["MA200", "#f1948a"]].forEach(function (m) {
      svg.appendChild(ns("line", { x1: lx, y1: P.t + 12, x2: lx + 16, y2: P.t + 12, stroke: m[1], "stroke-width": 2 }));
      svg.appendChild(ns("text", { x: lx + 20, y: P.t + 16, fill: m[1], "font-size": 12 }, m[0]));
      lx += 66;
    });
    for (k = 0; k <= 5; k++) {
      var idx = Math.round(i0 + (i1 - i0) * k / 5);
      svg.appendChild(ns("text", { x: X(idx), y: H - 6, fill: "#999", "font-size": 12, "text-anchor": k === 0 ? "start" : (k === 5 ? "end" : "middle") }, (s.dates[idx] || "").slice(2, 7)));
    }
    var vline = ns("line", { x1: 0, y1: P.t, x2: 0, y2: MG.b, stroke: "#888", "stroke-dasharray": "3 3", opacity: 0 });
    svg.appendChild(vline);
    CH.vline = vline;
    CH.view = { i0: i0, i1: i1, x0: x0, x1: x1, total: total, X: X };
    wireChart(svg);
  }
  function wireChart(svg) {
    if (svg.__wired) { return; }
    svg.__wired = true;
    svg.style.cursor = "crosshair";
    svg.addEventListener("pointerdown", function (ev) {
      CH.drag = { x: ev.clientX, i0: CH.i0, i1: CH.i1 };
      try { svg.setPointerCapture(ev.pointerId); } catch (e) { /* ignore */ }
      ev.preventDefault();
    });
    svg.addEventListener("pointerup", function () { CH.drag = null; });
    svg.addEventListener("pointercancel", function () { CH.drag = null; });
    svg.addEventListener("wheel", function (ev) {
      ev.preventDefault();
      var vw = CH.view;
      if (!vw) { return; }
      var rect = svg.getBoundingClientRect();
      var ratio = Math.min(1, Math.max(0, (ev.clientX - rect.left) / rect.width));
      var span = CH.i1 - CH.i0;
      var focus = CH.i0 + span * ratio;
      var next = Math.max(10, Math.min(vw.total, span * (ev.deltaY > 0 ? 1.15 : 0.87)));
      CH.i0 = Math.max(0, focus - next * ratio);
      CH.i1 = Math.min(vw.total - 1, CH.i0 + next);

    }, { passive: false });
    svg.addEventListener("pointermove", function (ev) {
      var vw = CH.view, s2 = CH.series;
      if (!vw || !s2) { return; }
      var rect = svg.getBoundingClientRect();
      if (CH.drag) {
        var span = CH.drag.i1 - CH.drag.i0;
        var per = span / rect.width;
        CH.i0 = Math.max(0, Math.min(vw.total - 1 - span, CH.drag.i0 - (ev.clientX - CH.drag.x) * per));
        CH.i1 = CH.i0 + span;
        drawChart();
        return;
      }
      var p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY;
      var pt = p.matrixTransform(svg.getScreenCTM().inverse());
      if (pt.x < vw.x0 || pt.x > vw.x1) { tip.style.display = "none"; if (CH.vline) { CH.vline.setAttribute("opacity", 0); } return; }
      var kk = Math.round(vw.i0 + (pt.x - vw.x0) / (vw.x1 - vw.x0) * (vw.i1 - vw.i0));
      if (kk < 0) { kk = 0; }
      if (kk >= vw.total) { kk = vw.total - 1; }
      if (CH.vline) { CH.vline.setAttribute("x1", vw.X(kk)); CH.vline.setAttribute("x2", vw.X(kk)); CH.vline.setAttribute("opacity", 1); }
      tipOn(ev, s2.dates[kk] + "<br>종가 " + num(s2.close[kk]) +
        "<br>MA20 " + num(s2.ma20[kk]) + " · MA50 " + num(s2.ma50[kk]) + " · MA200 " + num(s2.ma200[kk]) +
        "<br>RSI " + num(s2.rsi[kk], 1) + " · MACD " + num(s2.macd.line[kk], 2) +
        "<br>거래량 " + big(s2.vol[kk]));
    });
    svg.addEventListener("pointerleave", function () {
      tip.style.display = "none";
      if (CH.vline) { CH.vline.setAttribute("opacity", 0); }
      CH.drag = null;
    });
  }

  function setRange(n, mode) {
    var s = (mode === "w" && CH.weekly) ? CH.weekly : (CH.daily || CH.weekly);
    if (!s) { return; }
    CH.series = s;
    CH.mode = (s === CH.weekly) ? "w" : "d";
    var total = s.close.length;
    var len = n > 0 ? Math.min(total, n) : total;
    CH.i0 = Math.max(0, total - len);
    CH.i1 = total - 1;
    drawChart();
  }

  function drawBars(host, rows, opt) {
    opt = opt || {};
    var W = 1000, H = 320, PL = 80, PR = 12, PT = 18, PB = 54;
    var x0 = PL, x1 = W - PR, y0 = PT, y1 = H - PB;
    var all = [0];
    rows.forEach(function (r) { all.push(r.a === null || r.a === undefined ? 0 : r.a); if (r.b !== undefined && r.b !== null) { all.push(r.b); } });
    var hi = Math.max.apply(null, all), lo = Math.min.apply(null, all);
    var span = (hi - lo) || 1;
    function Y(v) { return y1 - (v - lo) / span * (y1 - y0); }
    var svg = svgBox(host, W, H);
    svg.appendChild(ns("line", { x1: x0, y1: Y(0), x2: x1, y2: Y(0), stroke: "#555" }));
    svg.appendChild(ns("text", { x: x0 - 8, y: Y(hi) + 5, fill: "#888", "font-size": 12, "text-anchor": "end" }, big(hi)));
    svg.appendChild(ns("text", { x: x0 - 8, y: Y(lo) + 5, fill: "#888", "font-size": 12, "text-anchor": "end" }, big(lo)));
    var slot = (x1 - x0) / rows.length;
    var bw = Math.min(44, slot * 0.3);
    rows.forEach(function (r, i) {
      var cx = x0 + slot * (i + 0.5);
      var two = !(r.b === undefined || r.b === null);
      var total = two ? (bw * 2 + 6) : bw;
      var left = cx - total / 2;
      function bar(v, color, xo, lab, labCol) {
        if (v === null || v === undefined) { return; }
        var top = Math.min(Y(v), Y(0)), hgt = Math.abs(Y(v) - Y(0));
        svg.appendChild(ns("rect", { x: xo, y: top, width: bw, height: Math.max(2, hgt), fill: color, rx: 3 }));
        if (lab) { svg.appendChild(ns("text", { x: xo + bw / 2, y: v >= 0 ? top - 5 : top + hgt + 15, fill: labCol, "font-size": 13, "text-anchor": "middle" }, lab)); }
      }
      if (two) {
        bar(r.a, "#3f4a57", left, r.aText, "#ccd", 0);
        bar(r.b, "#5aa9e6", left + bw + 6, r.bText, "#9fd");
      } else {
        bar(r.a, r.est ? "#5aa9e6" : "#3f4a57", left, r.aText, "#ccd");
      }
      svg.appendChild(ns("text", { x: cx, y: H - 32, fill: "#ddd", "font-size": 14, "text-anchor": "middle" }, r.label));
      if (r.sub) { svg.appendChild(ns("text", { x: cx, y: H - 13, fill: "#888", "font-size": 12, "text-anchor": "middle" }, r.sub)); }
    });
  }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function grade(score) {
    if (score >= 88) { return ["A+", "a"]; }
    if (score >= 78) { return ["A", "a"]; }
    if (score >= 68) { return ["B+", "b"]; }
    if (score >= 58) { return ["B", "b"]; }
    if (score >= 48) { return ["C+", "c"]; }
    if (score >= 38) { return ["C", "c"]; }
    if (score >= 28) { return ["D", "d"]; }
    return ["F", "f"];
  }
  function row(k, v) { return "<tr><td>" + k + "</td><td>" + v + "</td></tr>"; }

  function factors(d) {
    var g = d.growth || {};
    var mom = null;
    var cl = (d.ch && d.ch.c) ? d.ch.c : null;
    if (cl && cl.length > 130) {
      var a = cl[cl.length - 126], b = cl[cl.length - 1];
      mom = clamp(50 + (b / a - 1) * 120, 0, 100);
    }
    return [
      { k: "밸류에이션", v: (isNum(d.pe) && d.pe > 0) ? clamp(100 - (d.pe - 8) * 2.2, 0, 100) : null },
      { k: "성장성", v: isNum(g.rev) ? clamp(50 + ((g.rev || 0) + (g.earn || 0)) * 40, 0, 100) : null },
      { k: "수익성", v: isNum(g.margin) ? clamp((g.margin || 0) * 100 + (g.roe || 0) * 40, 0, 100) : null },
      { k: "모멘텀", v: mom },
      { k: "배당", v: isNum(d.divY) ? clamp(d.divY * 100 * 14, 0, 100) : null },
      { k: "재무건전성", v: isNum(g.debt) ? clamp(100 - (g.debt - 30) * 0.7, 0, 100) : null },
    ];
  }

  function metricRows(d) {
    return [
      ["시가총액", big(d.mcap)],
      ["거래량", isNum(d.vol) ? Number(d.vol).toLocaleString("en-US") : "-"],
      ["평균 거래량", big(d.avgVol)],
      ["전일 종가", num(d.prev)],
      ["52주 범위", num(d.w52L) + " ~ " + num(d.w52H)],
      ["PER (TTM)", num(d.pe)],
      ["PER (FWD)", num(d.fpe)],
      ["EPS (TTM)", num(d.eps)],
      ["EPS (FWD)", num(d.feps)],
      ["PBR", num(d.pb)],
      ["배당", num(d.div)],
      ["배당수익률", pct(d.divY)],
      ["공매도 잔량", isNum(d.short) ? big(d.short) + " (" + pct(d.shortPct) + ")" : "-"],
      ["공매도 비율", num(d.shortRatio)],
      ["베타", num(d.beta)]
    ];
  }

  function metricHtml(d) {
    var list = metricRows(d), half = Math.ceil(list.length / 2);
    function tbl(rows) {
      var out = "<table class=\"kv\">";
      rows.forEach(function (r) { out += "<tr><td>" + r[0] + "</td><td>" + r[1] + "</td></tr>"; });
      return out + "</table>";
    }
    return "<div class=\"two\"><div>" + tbl(list.slice(0, half)) + "</div><div>" + tbl(list.slice(half)) + "</div></div>";
  }

  function nextQuarter(label, step) {
    var m = /^(\d)Q(\d{4})$/.exec(label || "");
    if (!m) { return "추정"; }
    var q = Number(m[1]) + step, y = Number(m[2]);
    while (q > 4) { q -= 4; y += 1; }
    return q + "Q" + y;
  }

  function revenueRows(d) {
    var rows = [];
    var annual = (d.fin && d.fin.annual) || [];
    annual.forEach(function (a) { rows.push({ label: String(a.y), a: a.rev, aText: big(a.rev) }); });
    var lastYear = annual.length ? Number(annual[annual.length - 1].y) : null;
    (d.trend || []).forEach(function (t) {
      if (t.p === "0y" || t.p === "+1y") {
        var add = t.p === "0y" ? 1 : 2;
        rows.push({ label: (lastYear ? String(lastYear + add) : t.p) + "E", a: t.rev, est: true, aText: big(t.rev) });
      }
    });
    return rows;
  }

  function epsRows(d) {
    var rows = [];
    var eps = (d.fin && d.fin.eps) || [];
    eps.forEach(function (e) {
      rows.push({ label: e.q, a: e.act, b: e.est, aText: isNum(e.act) ? num(e.act, 2) : "", bText: isNum(e.est) ? num(e.est, 2) : "" });
    });
    var last = eps.length ? eps[eps.length - 1].q : "";
    (d.trend || []).forEach(function (t) {
      if (t.p === "0q" || t.p === "+1q") {
        var step = t.p === "0q" ? 1 : 2;
        rows.push({ label: nextQuarter(last, step), a: t.eps, est: true, aText: isNum(t.eps) ? num(t.eps, 2) : "" });
      }
    });
    return rows;
  }

  function analystHtml(d) {
    var r = d.rec || {};
    var total = (r.sb || 0) + (r.b || 0) + (r.h || 0) + (r.s || 0) + (r.ss || 0);
    var ko = { strong_buy: "강력 매수", buy: "매수", hold: "보유", underperform: "비중 축소", sell: "매도" }[r.key] || "";
    var h = "<h2>애널 평가</h2><div class=\"two\"><div><table class=\"kv\">" +
      row("증권가 의견", ko ? "<b>" + ko + "</b>" : "-") +
      row("평균 평점", num(r.mean)) +
      row("참여 애널리스트", isNum(r.n) ? num(r.n, 0) + "명" : "-") +
      row("목표주가 평균", num(r.tgt)) +
      row("목표주가 최고 / 최저", num(r.tgtH) + " / " + num(r.tgtL)) +
      "</table></div><div>";
    if (total) {
      [["강력 매수", r.sb, "#2e7d5b"], ["매수", r.b, "#7dcea0"], ["보유", r.h, "#f7dc6f"], ["매도", r.s, "#f0a05a"], ["강력 매도", r.ss, "#ef5350"]].forEach(function (x) {
        var c = x[1] || 0;
        h += "<div class=\"bar-row\"><span class=\"lbl\">" + x[0] + "</span><span class=\"track\"><i style=\"width:" + (c / total * 100) + "%;background:" + x[2] + "\"></i></span><span class=\"val\">" + c + "명</span></div>";
      });
      h += "<p class=\"sub\">합계 " + total + "명 · 출처 Yahoo Finance</p>";
    } else {
      h += "<p class=\"sub\">애널 의견 데이터가 없습니다.</p>";
    }
    h += "</div></div><h2 style=\"margin-top:16px\">팩터 등급 (참고 계산)</h2><div class=\"two\">";
    var list = factors(d), cols = [[], []];
    list.forEach(function (f, i) { cols[i % 2].push(f); });
    cols.forEach(function (col) {
      h += "<div><table class=\"kv\">";
      col.forEach(function (f) {
        var g = f.v === null ? ["-", "c"] : grade(f.v);
        h += "<tr><td>" + f.k + "</td><td><span class=\"g " + g[1] + "\">" + g[0] + "</span></td></tr>";
      });
      h += "</table></div>";
    });
    h += "</div><p class=\"sub\">시킹알파의 등급이 아니라, 공개 재무지표로 계산한 참고용 등급입니다.</p>";
    return h;
  }

  function profileHtml(d) {
    var p = d.prof || {};
    var asof = "";
    if (d.ch && d.ch.d0 && d.ch.dd && d.ch.dd.length) {
      asof = new Date(new Date(d.ch.d0 + "T00:00:00Z").getTime() + d.ch.dd[d.ch.dd.length - 1] * 86400000).toISOString().slice(0, 10);
    }
    function tv(korean, english) {
      if (korean) { return esc(korean); }
      if (!english) { return "-"; }
      return "<span data-en=\"" + escAttr(english) + "\">" + esc(english) + "</span>";
    }
    var h = "<h2>회사 정보</h2><table class=\"kv\">" +
      row("국가", tv(p.cKo, p.c)) +
      row("섹터", tv(p.sKo, p.s)) +
      row("산업", tv(p.iKo, p.i)) +
      row("본사", esc(p.city || "-")) +
      row("직원 수", isNum(p.emp) ? Number(p.emp).toLocaleString("en-US") + "명" : "-") +
      row("홈페이지", p.web ? "<a href=\"" + esc(p.web) + "\" target=\"_blank\" rel=\"noopener\">" + esc(String(p.web).replace(/^https?:\/\//, "")) + "</a>" : "-") +
      "</table>";
    if (p.sumKo) {
      h += "<p class=\"sub\" style=\"margin-top:14px;font-size:15px;line-height:1.75;color:#ddd\">" + esc(p.sumKo) + "</p>";
      if (p.sum) { h += "<details style=\"margin-top:10px\"><summary class=\"sub\" style=\"cursor:pointer\">영문 원문 보기</summary><p class=\"sub\" style=\"margin-top:6px\">" + esc(p.sum) + "</p></details>"; }
    } else if (p.sum) {
      h += "<p class=\"sub\" data-en=\"" + escAttr(p.sum) + "\" style=\"margin-top:14px;font-size:15px;line-height:1.75;color:#ddd\">" + esc(p.sum) + "</p>";
    }
    h += "<p class=\"sub\">출처 Yahoo Finance · 시세 기준 " + esc(asof) + "</p>";
    return h;
  }
  var RANGES = [["1개월", 22, "d"], ["3개월", 63, "d"], ["6개월", 126, "d"], ["1년", 252, "d"], ["5년 (주봉)", 260, "w"], ["전체", 0, "w"]];
  var range = 252;

  function render(d) {
    var ko = d.nKo || knownName(d.t) || d.n;
    document.title = d.t + " · " + ko;
    var up = (d.chg || 0) >= 0;
    var cls = up ? "up" : "down";
    var h = "<div class=\"card\"><div class=\"sym\">" + esc(d.ex || "") + " · " + esc(d.cur || "") + " · " + esc(d.t) + "</div>";
    h += "<div class=\"nm\">" + esc(ko) + "</div>";
    if (d.nKo && d.nKo !== d.n) { h += "<div class=\"sub\" style=\"margin:0 0 6px\">" + esc(d.n) + "</div>"; }
    h += "<div><span class=\"px\">" + num(d.px) + "</span><span class=\"chg " + cls + "\">" + (up ? "+" : "") + num(d.chg) + " (" + (up ? "+" : "") + pct(d.chgPct) + ")</span></div>";
    h += "<div class=\"sub\">" + (d.dayL && d.dayH ? "장중 " + num(d.dayL) + " ~ " + num(d.dayH) + " · " : "") + "전일 " + num(d.prev) + " · 52주 " + num(d.w52L) + " ~ " + num(d.w52H) + "</div></div>";
    h += "<nav class=\"tabs\"><a href=\"#s1\">요약</a><a href=\"#s2\">실적</a><a href=\"#s3\">애널 평가</a><a href=\"#s4\">회사 정보</a></nav>";
    h += "<div class=\"card\" id=\"s1\"><h2>주가 · 거래량 · RSI · MACD</h2><div class=\"ctrls\">";
    h += RANGES.map(function (r, i) { return "<button type=\"button\" data-n=\"" + r[1] + "\" data-m=\"" + r[2] + "\"" + (i === 3 ? " class=\"on\"" : "") + ">" + r[0] + "</button>"; }).join("");
    h += "<button type=\"button\" data-reset=\"1\">초기화</button>";
    h += "<span class=\"hint\">확대/축소: 마우스 휠 · 이동: 드래그</span></div>";
    h += "<div id=\"chart\"></div></div>";
    h += "<div class=\"card\"><h2>주요 지표</h2>" + metricHtml(d) + "</div>";
    h += "<div class=\"card\" id=\"s2\"><h2>매출</h2><div id=\"revChart\"></div><div class=\"sub\">연간 매출입니다. 실적치(회색)와 추정치(파란색, E)를 함께 봅니다.</div></div>";
    h += "<div class=\"card\"><h2>주당순이익 (EPS)</h2><div id=\"epsChart\"></div><div class=\"sub\">분기 주당순이익 실적치(회색)와 추정치(파란색)입니다.</div></div>";
    h += "<div class=\"card\" id=\"s3\">" + analystHtml(d) + "</div>";
    h += "<div class=\"card\" id=\"s4\">" + profileHtml(d) + "</div>";
    app.innerHTML = h;
    fillKo(app);

    var chartHost = document.getElementById("chart");
    CH.daily = (d.ch && d.ch.c && d.ch.c.length) ? seriesFrom(d.ch) : null;
    CH.weekly = (d.cw && d.cw.c && d.cw.c.length) ? seriesFrom(d.cw) : null;
    if (CH.daily || CH.weekly) {
      CH.host = chartHost;
      CH.drag = null;
      setRange(range, "d");
    } else {
      chartHost.innerHTML = "<p class=\"sub\">차트 데이터가 없습니다.</p>";
    }
    var rev = revenueRows(d);
    if (rev.length) { drawBars(document.getElementById("revChart"), rev); }
    var eps = epsRows(d);
    if (eps.length) { drawBars(document.getElementById("epsChart"), eps); }
    Array.prototype.forEach.call(document.querySelectorAll(".ctrls button"), function (btn) {
      btn.addEventListener("click", function () {
        if (btn.getAttribute("data-reset")) {
          setRange(252, "d");
          return;
        }
        Array.prototype.forEach.call(document.querySelectorAll(".ctrls button"), function (x) { x.classList.remove("on"); });
        btn.classList.add("on");
        setRange(Number(btn.getAttribute("data-n")), btn.getAttribute("data-m"));
      });
    });
  }

  function fileName(sym) {
    return String(sym).toUpperCase().replace(/\./g, "_").replace(/\^/g, "IDX_").replace(/-/g, "_");
  }

  function load(sym) {
    var ticker = resolve(sym);
    app.innerHTML = "<p class=\"msg\">불러오는 중…</p>";
    fetch("data/" + fileName(ticker) + ".json").then(function (r) {
      if (!r.ok) { throw new Error("notfound"); }
      return r.json();
    }).then(function (d) {
      render(d);
      if (q) { q.value = d.t; }
    }).catch(function () {
      app.innerHTML = "<p class=\"msg\">'" + esc(sym) + "' 는 저장된 데이터가 없습니다.<br>" +
        "티커(예: NVDA, 005930)나 회사명(예: 삼성전자, 엔비디아)으로 검색할 수 있습니다.<br>" +
        "미국은 S&P 500 종목, 한국은 주요 종목, ETF는 QQQ · SPY · SOXX · SOXL · TQQQ 등을 제공합니다.<br>" +
        "데이터를 늘리려면 <code>python Premium/hansjang/stock/update_stock.py</code> 를 실행합니다.</p>";
    });
  }

  var INDEX = [];
  var INDEX_READY = false;
  // 자주 쓰는 줄임말 (풀네임은 index 의 k 로 자동 매칭)
  var ALIAS = {
    "삼전": "005930.KS", "현대차": "005380.KS", "기아차": "000270.KS", "하닉": "000660.KS",
    "엘지": "003550.KS", "엘지화학": "051910.KS", "엘지전자": "066570.KS",
    "삼바": "207940.KS", "두산": "000150.KS", "한전": "015760.KS", "쌍용차": "003620.KS",
    "포스코": "005490.KS", "네이버": "035420.KS", "엔비디아": "NVDA", "애플": "AAPL",
    "테슬라": "TSLA", "마이크론": "MU", "브로드컴": "AVGO", "반도체": "SOXX", "나스닥": "QQQ"
  };

  function resolve(input) {
    var raw = String(input || "").trim();
    if (!raw) { return raw; }
    var m = /\(([^)]+)\)\s*$/.exec(raw);
    if (m) { raw = m[1].trim(); }
    var upper = raw.toUpperCase();
    var flat = upper.replace(/\s+/g, "");
    var i;
    for (i = 0; i < INDEX.length; i++) {
      var tk = INDEX[i].t.toUpperCase();
      if (tk === upper || tk.indexOf(upper + ".") === 0) { return INDEX[i].t; }
    }
    if (ALIAS[raw]) { return ALIAS[raw]; }
    if (!INDEX_READY) { return raw; }
    function shorter(cur, row) {
      if (!row.k) { return cur; }
      return (cur === null || row.k.length < cur.k.length) ? row : cur;
    }
    var exact = null, prefix = null, part = null, en = null;
    for (i = 0; i < INDEX.length; i++) {
      var row = INDEX[i];
      if (row.k) {
        var kf = row.k.replace(/\s+/g, "");
        if (row.k === raw) { exact = shorter(exact, row); }
        if (kf.indexOf(flat) === 0) { prefix = shorter(prefix, row); }
        if (kf.indexOf(flat) >= 0) { part = shorter(part, row); }
      }
      if (en === null && (row.n || "").replace(/\s+/g, "").toUpperCase().indexOf(flat) >= 0) { en = row; }
    }
    var hit = exact || prefix || part || en;
    return hit ? hit.t : raw;
  }

  function loadIndex() {
    return fetch("index.json").then(function (r) { return r.json(); }).then(function (rows) {
      INDEX = rows || [];
      INDEX_READY = true;
      var frag = document.createDocumentFragment();
      INDEX.forEach(function (r) {
        var o = document.createElement("option");
        o.value = r.t;
        o.label = (r.k ? r.k + " · " : "") + r.n + (r.m ? " · " + r.m : "");
        frag.appendChild(o);
        if (r.k) {
          var o2 = document.createElement("option");
          o2.value = r.k;
          o2.label = r.t + " · " + r.n;
          frag.appendChild(o2);
        }
      });
      dl.appendChild(frag);
    }).catch(function () {});
  }

  document.getElementById("sform").addEventListener("submit", function (e) {
    e.preventDefault();
    var v = (q.value || "").trim();
    if (!v) { return; }
    location.href = "?symbol=" + encodeURIComponent(resolve(v));
  });

  var sym = new URLSearchParams(location.search).get("symbol") || "NVDA";
  loadIndex().then(function () { load(sym); });
})();
</script>
