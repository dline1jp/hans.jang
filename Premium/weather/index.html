.gauge-wrap { max-width: 1100px; margin: 27px auto; }
.gauge-note { margin: 12px 0 18px; color: #ccc; font-size: 22px; line-height: 1.45; }
.gauge-board { width: 100%; }
.gauge-row {
  display: grid;
  grid-template-columns: 52px 110px minmax(140px, 1fr) 72px;
  gap: 8px 10px;
  align-items: center;
  border-bottom: 1px solid #333;
  padding: 8px 0 10px;
  font-size: 22px;
}
.gauge-row a { color: #4da3ff; font-weight: 700; text-decoration: underline; }
.ticks { display: flex; justify-content: space-between; color: #D8C0FF; font-size: 16px; font-weight: 700; position: sticky; top: 0; z-index: 2; background: #111; padding: 8px 0; }
.ticks i { font-style: normal; }
.gauge-row .track { grid-column: 1 / -1; }
.track {
  position: relative;
  height: 34px;
  background-image: repeating-linear-gradient(
    to right,
    rgba(216,192,255,0.35) 0,
    rgba(216,192,255,0.35) 1px,
    transparent 1px,
    transparent calc(100% / 5)
  );
}
.track .line {
  position: absolute;
  left: 0;
  right: 0;
  top: 50%;
  height: 3px;
  background: #c8c8c8;
  transform: translateY(-50%);
}
.track .dot {
  position: absolute;
  top: 50%;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: #e53935;
  transform: translate(-50%, -50%);
  box-shadow: 0 0 0 3px #111;
}
.track .dot.buy { background: #7dcea0; }
.gauge-val { text-align: right; font-weight: 700; }
.gauge-val.buy { color: #7dcea0; }
.gauge-val.sell { color: #f1948a; }
@media (max-width: 800px) {
  .gauge-row {
    grid-template-columns: 42px minmax(0, 1fr) auto;
    gap: 2px 10px;
    font-size: 27px;
    line-height: 1.25;
  }
  .gauge-row > span:nth-child(1) { grid-column: 1; grid-row: 1; }
  .gauge-row > span:nth-child(2) { grid-column: 2; grid-row: 1; }
  .gauge-row > span:nth-child(3) { grid-column: 2; grid-row: 2; }
  .gauge-row > span:nth-child(4) {
    grid-column: 3;
    grid-row: 1 / span 2;
    align-self: center;
  }
  .gauge-note { font-size: 27px; }
  .ticks { font-size: 27px; }
}
