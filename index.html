<!DOCTYPE html>

    <style>
        body {
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
        }

        h1 {
            color: gold;
            font-size: 60px;
            text-align: center;

        .subtitle-ko {

        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            max-width: 1400px;
            margin: auto;
        }

        .card {
            background: #222;
            border: 1px solid #444;
            border-radius: 10px;
            padding: 25px;
            text-align: center;
            text-decoration: none;
            color: white;
            transition: 0.3s;
            min-height: 200px;
        }

        .card:hover {
            background: #333;
            border-color: gold;
            transform: scale(1.03);
        }

.card-title {
    font-size: 20px;
    font-weight: bold;
}

canvas {
    width:100% !important;
    height:180px !important;
}
