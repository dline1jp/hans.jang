name: Update CNN fear and greed signal
on:
  workflow_dispatch:
  schedule:
    # 미국장 마감(금요일 포함) 후, 화~토 08:00 KST 에 갱신합니다.
    - cron: "0 23 * * 1-5"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python Premium/weather/feargreed/update_feargreed.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Premium/weather/feargreed/index.html
          git diff --cached --quiet || git commit -m "Update CNN fear and greed buy signal"
          git push
