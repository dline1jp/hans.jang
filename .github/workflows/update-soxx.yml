name: Update SOXX entry points
on:
  workflow_dispatch:
  schedule:
    # SOXX 일봉 시세(RSI 타점)는 매일 갱신한다. 미국 현물장 마감 후인 22:30 UTC = 다음날 07:30 KST 에 돌린다.
    - cron: "30 22 * * *"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python Premium/hansjang/SOXX/update_soxx.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Premium/hansjang/SOXX/soxx-data.js Premium/hansjang/index.html Premium/ai-trend/index.html
          git diff --cached --quiet || git commit -m "Update SOXX entry point charts"
          git push