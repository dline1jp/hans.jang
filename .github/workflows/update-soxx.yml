name: Update SOXX entry points
on:
  workflow_dispatch:
  schedule:
    # 미국 금요일 종가가 확정된 뒤 토요일 03:00 UTC = 12:00 KST 에 갱신합니다.
    - cron: "0 3 * * 6"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python Premium/hansjang/SOXX/update_soxx.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Premium/hansjang/SOXX/soxx-data.js Premium/hansjang/index.html Premium/ai-trend/index.html
          git diff --cached --quiet || git commit -m "Update SOXX entry point charts"
          git push