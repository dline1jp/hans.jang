name: Update stock weather
on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * 6"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas requests
      - run: python Premium/weather/update_rank.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Premium/weather/index.html
          git diff --cached --quiet || git commit -m "Update weekly 200-MA ranking"
          git push
