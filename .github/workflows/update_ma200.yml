name: Update 200-day MA signals
on:
  workflow_dispatch:
  schedule:
    # 22:30 UTC = 07:30 KST the next calendar day, after the US cash close.
    - cron: "30 22 * * 1-5"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python Premium/weather/200/update_ma200.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Premium/weather/200/index.html
          git diff --cached --quiet || git commit -m "Update daily 200-day MA signals"
          git push

