name: Update 200-week buy points
on:
  workflow_dispatch:
  schedule:
    # 매주 토요일 03:00 UTC = 12:00 KST. 미국 금요일 종가가 확정된 뒤에 갱신합니다.
    - cron: "0 3 * * 6"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python Premium/hansjang/200W/update_200w.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Premium/hansjang/200W/index.html Premium/hansjang/summary-data.js
          git diff --cached --quiet || git commit -m "Update weekly 200-week buy points"
          git push
