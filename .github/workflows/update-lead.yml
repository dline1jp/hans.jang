name: Update leading-index entry points
on:
  workflow_dispatch:
  schedule:
    # G20 경기선행지수(월별)는 매달 초에 전월치가 나옵니다. 매달 5일 03:00 UTC = 12:00 KST 에 갱신합니다.
    - cron: "0 3 5 * *"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python Premium/hansjang/LEAD/update_lead.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Premium/hansjang/LEAD/lead-data.js
          git diff --cached --quiet || git commit -m "Update leading-index entry points"
          git push
