name: Update leading-index entry points
on:
  workflow_dispatch:
  schedule:
    # QQQ 일봉 시세(RSI 타점)는 매일 갱신한다. G20 경기선행지수(월별)는 새 값이 나오면 자동 반영된다.
    # 미국 현물장 마감 후인 22:30 UTC = 다음날 07:30 KST 에 돌린다.
    - cron: "30 22 * * *"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python Premium/hansjang/LEAD/update_lead.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Premium/hansjang/LEAD/lead-data.js
          git diff --cached --quiet || git commit -m "Update leading-index entry points"
          git push
